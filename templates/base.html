<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}게시판{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --bg: #EDF0F3;
      --surface: #FFFFFF;
      --ink: #16202A;
      --muted: #5E6B78;
      --line: #D6DDE4;
      --accent: #0E6E62;
      --accent-ink: #FFFFFF;
      --danger: #B4352A;
      --focus: #1F8BFF;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161B;
        --surface: #192129;
        --ink: #E4EAF0;
        --muted: #91A0AE;
        --line: #2B3540;
        --accent: #3DBDA6;
        --accent-ink: #0B1A17;
        --danger: #F07B6E;
        --focus: #6CB4FF;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

    /* 상단 바 */
    .top { border-bottom: 1px solid var(--line); background: var(--surface); }
    .top .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
    .brand { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; text-decoration: none; }

    main { padding: 40px 0 80px; }

    /* 버튼 */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 40px; padding: 0 16px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--surface); color: var(--ink);
      font: inherit; font-size: 15px; font-weight: 600;
      text-decoration: none; cursor: pointer;
    }
    .btn:hover { border-color: var(--muted); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
    .btn-danger { color: var(--danger); }
    .btn-danger:hover { border-color: var(--danger); }

    .muted { color: var(--muted); }

    @media (prefers-reduced-motion: no-preference) {
      .btn, .row { transition: background-color .15s, border-color .15s; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/posts">자유게시판</a>
      <a class="btn btn-primary" href="/posts/new">글쓰기</a>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
