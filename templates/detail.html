{% extends "base.html" %}
{% block title %}{{ post.title }} - 게시판{% endblock %}
{% block head %}
<style>
  .back { display: inline-block; margin-bottom: 24px; font-size: 14px; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--ink); }

  article { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 36px 40px; }
  article h1 { margin: 0 0 12px; font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25; }
  .meta { font-size: 14px; color: var(--muted); padding-bottom: 24px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .body { padding-top: 24px; font-size: 17px; line-height: 1.8; white-space: pre-wrap; max-width: 65ch; }

  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .actions form { margin: 0; }

  @media (max-width: 560px) {
    article { padding: 24px 20px; }
    article h1 { font-size: 26px; }
  }
</style>
{% endblock %}

{% block content %}
<a class="back" href="/posts">← 목록으로</a>

<article>
  <h1>{{ post.title }}</h1>
  <div class="meta">
    {{ post.created_at | dt }}
    {% if post.updated_at %}<span> (수정됨 {{ post.updated_at | dt }})</span>{% endif %}
  </div>
  <div class="body">{{ post.content }}</div>
</article>

<div class="actions">
  <a class="btn" href="/posts/{{ post.id }}/edit">수정</a>
  <form action="/posts/{{ post.id }}/delete" method="post"
        onsubmit="return confirm('이 글을 삭제할까요? 되돌릴 수 없어요.')">
    <button class="btn btn-danger" type="submit">삭제</button>
  </form>
</div>
{% endblock %}
